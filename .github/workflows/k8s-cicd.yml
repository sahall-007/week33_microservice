name: Build and Deploy to Kubernetes

on:
  push:
    branches:
      - main

jobs:

  # --------------------------------
  # 1. Build and push Docker images
  # --------------------------------
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - name: api-gateway
            context: .
            dockerfile: ./api-gateway/Dockerfile
            image: sahal007/week33-api-gateway

          - name: user-service
            context: .
            dockerfile: ./user-service/Dockerfile
            image: sahal007/week33-user-service

          - name: order-service
            context: .
            dockerfile: ./order-service/Dockerfile
            image: sahal007/week33-order-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ matrix.service.image }}:latest
            ${{ matrix.service.image }}:${{ github.sha }}


  # --------------------------------
  # 2. Deploy to Kubernetes
  # --------------------------------
  deploy:
    needs: build-and-push
    runs-on: self-hosted    

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/

      - name: Update API Gateway image
        run: kubectl set image deployment/api-gateway api-gateway=sahal007/week33-api-gateway:${{ github.sha }}

      - name: Update User Service image
        run: kubectl set image deployment/user-service user-service=sahal007/week33-user-service:${{ github.sha }}

      - name: Update Order Service image
        run: kubectl set image deployment/order-service order-service=sahal007/week33-order-service:${{ github.sha }}

      - name: Wait for API Gateway rollout
        run: kubectl rollout status deployment/api-gateway --timeout=120s

      - name: Wait for User Service rollout
        run: kubectl rollout status deployment/user-service --timeout=120s

      - name: Wait for Order Service rollout
        run: kubectl rollout status deployment/order-service --timeout=120s


  # --------------------------------
  # 3. Rollback if deployment fails
  # --------------------------------
  rollback:
    needs: deploy
    if: ${{ needs.deploy.result == 'failure' }}
    runs-on: self-hosted

    steps:
      - name: Rollback API Gateway
        run: kubectl rollout undo deployment/api-gateway

      - name: Rollback User Service
        run: kubectl rollout undo deployment/user-service

      - name: Rollback Order Service
        run: kubectl rollout undo deployment/order-service