apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:
      containers:
        - name: user-service
          image: week33-user-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3001

            - name: grpc
              containerPort: 50051

          env:
            - name: MONGODB_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MONGODB_URL

            - name: JWT_ACCESS
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_ACCESS